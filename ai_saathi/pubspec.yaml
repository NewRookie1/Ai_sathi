name: artisan_ai
description: "AI-Driven Market Linkage & Smart Cataloging App for Artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Camera & Images
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.3
  
  # Audio
  flutter_sound: ^9.2.13
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.1
  
  # Permissions
  permission_handler: ^11.3.0
  
  # Navigation
  go_router: ^13.2.0
  
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_markdown: ^0.6.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  path: ^1.8.3
  
  # Animations
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../AI_Artisan_Marketplace_Icon.png"
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "../AI_Artisan_Marketplace_Icon.png"
